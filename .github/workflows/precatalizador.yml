name: Radar precatalizador semanal
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-precatalizador
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: precatalizador/requirements.txt
      - run: python -m pip install -r precatalizador/requirements.txt
      - name: Escanear lista curada y avisar cruces nuevos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python precatalizador/weekly.py
      - name: Guardar último barrido
        run: |
          git config user.name 'Davizz-dev13'
          git config user.email 'davidgallardomoreno7@gmail.com'
          git add precatalizador/scan.json
          git diff --cached --quiet || git commit -m "Radar precatalizador: $(date -u +%Y-%m-%d)"
          git push
